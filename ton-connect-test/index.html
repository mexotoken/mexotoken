<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MEXO Wallet</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {

    background:
        radial-gradient(
            circle at top,
            #302512 0%,
            #17130d 48%,
            #090806 100%
        );

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ==========================================
   MAIN CARD
   ========================================== */

.wallet-card {

    width: min(92vw, 430px);

    padding: 23px 21px 19px;

    border-radius: 27px;

    background:
        linear-gradient(
            145deg,
            rgba(38, 31, 20, 0.98),
            rgba(14, 12, 9, 0.99)
        );

    border: 1px solid
        rgba(232, 179, 69, 0.28);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.58),
        inset 0 1px 0 rgba(255,255,255,0.04);

    display: flex;
    flex-direction: column;
    align-items: center;

}


/* ==========================================
   LOGO
   ========================================== */

.logo {

    width: 76px;
    height: 76px;

    object-fit: contain;

    margin-bottom: 4px;

    filter:
        drop-shadow(
            0 5px 18px rgba(228,174,60,0.24)
        );
}


/* ==========================================
   TITLE
   ========================================== */

.title {

    margin: 0;

    font-size: 26px;

    font-weight: 800;

    letter-spacing: 3.5px;

    color: #f0c45d;

    text-align: center;
}


.subtitle {

    margin-top: 4px;

    margin-bottom: 15px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.50);

    letter-spacing: 1.1px;
}


/* ==========================================
   DESCRIPTION
   ========================================== */

.description {

    width: 100%;

    text-align: center;

    font-size: 13.5px;

    line-height: 1.55;

    color:
        rgba(255,255,255,0.82);

    margin-bottom: 10px;
}


/* ==========================================
   SECURITY BOX
   ========================================== */

.security {

    width: 100%;

    padding: 9px 11px;

    border-radius: 12px;

    border: 1px solid
        rgba(240,196,93,0.42);

    background:
        rgba(39,31,21,0.96);

    color:
        #f5e7c9;

    text-align: center;

    font-size: 11px;

    line-height: 1.42;

    margin-bottom: 12px;

    animation:
        securityBlink 1s infinite;
}


@keyframes securityBlink {

    0%,
    45% {

        background:
            rgba(39,31,21,0.96);

        border-color:
            rgba(240,196,93,0.42);
    }

    50%,
    100% {

        background:
            rgba(108,38,38,0.70);

        border-color:
            rgba(255,100,100,0.72);
    }

}


/* ==========================================
   CONNECT BUTTON
   ========================================== */

.connect-button {

    width: 100%;

    height: 47px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #f0c45d,
            #c88e24
        );

    color: #171109;

    font-size: 13.5px;

    font-weight: 800;

    letter-spacing: 0.25px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(212,157,42,0.22);

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}


.connect-button:active {

    transform: scale(0.98);

}


.connect-button:disabled {

    opacity: 0.55;

}


/* ==========================================
   MANUAL TITLE
   ========================================== */

.manual-title {

    width: 100%;

    margin-top: 14px;

    margin-bottom: 6px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.53);

    text-align: left;
}


/* ==========================================
   MANUAL ROW
   ========================================== */

.manual-row {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 7px;
}


/* ==========================================
   INPUT
   ========================================== */

.wallet-input {

    flex: 1;

    min-width: 0;

    height: 42px;

    padding: 0 10px;

    border-radius: 11px;

    border: 1px solid
        rgba(255,255,255,0.13);

    outline: none;

    background:
        rgba(255,255,255,0.055);

    color: #ffffff;

    font-size: 10.5px;

    letter-spacing: 0.1px;
}


.wallet-input::placeholder {

    color:
        rgba(255,255,255,0.33);
}


.wallet-input:focus {

    border-color:
        rgba(240,196,93,0.65);
}


/* ==========================================
   CONFIRM BUTTON
   ========================================== */

.confirm-button {

    width: 86px;

    height: 42px;

    flex-shrink: 0;

    border-radius: 11px;

    border: 1px solid
        rgba(240,196,93,0.42);

    background:
        rgba(240,196,93,0.14);

    color: #f0c45d;

    font-size: 11.5px;

    font-weight: 800;

    cursor: pointer;
}


.confirm-button:active {

    transform: scale(0.98);

}


.confirm-button:disabled {

    opacity: 0.5;

}


/* ==========================================
   STATUS
   ========================================== */

.status {

    width: 100%;

    min-height: 18px;

    margin-top: 8px;

    text-align: center;

    font-size: 10.5px;

    color:
        rgba(255,255,255,0.60);
}


/* ==========================================
   FOOTER
   ========================================== */

.footer {

    margin-top: 10px;

    font-size: 8.5px;

    color:
        rgba(255,255,255,0.25);

    text-align: center;
}


/* ==========================================
   SMALL SCREEN
   ========================================== */

@media (max-height: 650px) {

    .wallet-card {

        padding-top: 15px;

        padding-bottom: 13px;
    }

    .logo {

        width: 62px;

        height: 62px;
    }

    .title {

        font-size: 23px;
    }

    .subtitle {

        margin-bottom: 10px;
    }

    .description {

        margin-bottom: 7px;
    }

    .security {

        margin-bottom: 8px;

        padding: 7px 9px;
    }

    .manual-title {

        margin-top: 9px;
    }

    .footer {

        margin-top: 6px;
    }

}

</style>

</head>


<body>


<div class="wallet-card">


    <!-- ======================================
         MEXO LOGO
         ====================================== -->

    <img
        class="logo"
        src="https://raw.githubusercontent.com/mexotoken/mexotoken/main/logo.png"
        alt="MEXO Logo"
    >


    <!-- ======================================
         TITLE
         ====================================== -->

    <h1 class="title">
        MEXO
    </h1>


    <div class="subtitle">
        TON WALLET
    </div>


    <!-- ======================================
         DESCRIPTION
         ====================================== -->

    <div class="description">

        Add your TON wallet address.

        <br>

        Choose how you want to provide it.

    </div>


    <!-- ======================================
         SECURITY
         ====================================== -->

    <div class="security">

        🔐 <strong>Security notice:</strong>
        Only your public TON wallet address is required.
        Never enter your seed phrase or private key.

    </div>


    <!-- ======================================
         DIRECT CONNECTION
         ====================================== -->

    <button
        id="connectButton"
        class="connect-button"
        onclick="connectWallet()"
    >

        💎 CONNECT TON WALLET

    </button>


    <!-- ======================================
         MANUAL WALLET
         ====================================== -->

    <div class="manual-title">

        Or enter your TON wallet address manually

    </div>


    <div class="manual-row">

        <input
            id="walletInput"
            class="wallet-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="EQ... / UQ..."
        >


        <button
            id="confirmButton"
            class="confirm-button"
            onclick="confirmManualWallet()"
        >

            CONFIRM

        </button>

    </div>


    <!-- ======================================
         STATUS
         ====================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <div class="footer">

        MEXO • TON Network

    </div>


</div>


<script>

/* ==========================================
   MEXO WALLET PAGE
   ========================================== */


/*
   This page is opened by the MEXO bot as:

   wallet.html?sid=12345678

   The session ID is used to connect the
   wallet submission to the correct
   withdrawal request.
*/


const BOT_USERNAME =
    "mexoairdrop_bot";


/* ==========================================
   READ URL
   ========================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const sessionId =
    urlParams.get("sid") || "";


/* ==========================================
   ELEMENTS
   ========================================== */

const walletInput =
    document.getElementById(
        "walletInput"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const connectButton =
    document.getElementById(
        "connectButton"
    );


const confirmButton =
    document.getElementById(
        "confirmButton"
    );


/* ==========================================
   STATUS
   ========================================== */

function setStatus(text) {

    statusBox.textContent = text;

}


/* ==========================================
   TON WALLET VALIDATION
   ========================================== */

function isValidTonAddress(address) {

    address =
        address.trim();


    if (!address) {

        return false;

    }


    if (
        !address.startsWith("EQ")
        &&
        !address.startsWith("UQ")
    ) {

        return false;

    }


    if (
        address.length !== 48
    ) {

        return false;

    }


    return true;

}


/* ==========================================
   RETURN TO TELEGRAM
   ========================================== */

function returnToBot(
    walletAddress
) {

    walletAddress =
        walletAddress.trim();


    /* --------------------------------------
       Session check
       -------------------------------------- */

    if (!sessionId) {

        setStatus(
            "❌ Invalid withdrawal session."
        );

        return;

    }


    /* --------------------------------------
       Wallet check
       -------------------------------------- */

    if (
        !isValidTonAddress(
            walletAddress
        )
    ) {

        setStatus(
            "❌ Invalid TON wallet address."
        );

        return;

    }


    /* --------------------------------------
       Create Telegram start parameter
       -------------------------------------- */

    const startParameter =
        "w_"
        +
        sessionId
        +
        "_"
        +
        walletAddress;


    /* --------------------------------------
       Telegram bot URL
       -------------------------------------- */

    const telegramUrl =
        "https://t.me/"
        +
        BOT_USERNAME
        +
        "?start="
        +
        encodeURIComponent(
            startParameter
        );


    /* --------------------------------------
       Disable buttons
       -------------------------------------- */

    connectButton.disabled =
        true;

    confirmButton.disabled =
        true;

    walletInput.disabled =
        true;


    setStatus(
        "✅ Wallet confirmed. Returning to MEXO..."
    );


    /* --------------------------------------
       Return to Telegram
       -------------------------------------- */

    setTimeout(
        function() {

            window.location.href =
                telegramUrl;

        },
        250
    );

}


/* ==========================================
   MANUAL CONFIRM
   ========================================== */

function confirmManualWallet() {

    const address =
        walletInput.value.trim();


    if (
        !isValidTonAddress(
            address
        )
    ) {

        setStatus(
            "❌ Invalid TON wallet address."
        );

        walletInput.focus();

        return;

    }


    returnToBot(
        address
    );

}


/* ==========================================
   CONNECT TON WALLET
   ========================================== */

async function connectWallet() {

    /*
       Direct TON Connect will be integrated
       here.

       No transaction is requested by this page.
       The page only needs the PUBLIC wallet
       address.
    */


    setStatus(
        "Opening TON wallet..."
    );


    try {

        /*
           If TON Connect UI has already been
           loaded by the environment, use it.
        */

        if (
            window.tonConnectUI
            &&
            typeof
            window.tonConnectUI.openModal
            ===
            "function"
        ) {

            await
            window.tonConnectUI.openModal();

            return;

        }


        /*
           Direct TON Connect is not installed
           on this page yet.
        */

        setStatus(
            "Direct wallet connection is not "
            +
            "available yet. You can enter your "
            +
            "TON address manually."
        );


    }
    catch (error) {

        console.error(
            error
        );

        setStatus(
            "Wallet connection was cancelled."
        );

    }

}


/* ==========================================
   ENTER KEY SUPPORT
   ========================================== */

walletInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            confirmManualWallet();

        }

    }
);


/* ==========================================
   SESSION CHECK
   ========================================== */

if (!sessionId) {

    setStatus(
        "⚠️ Please open this wallet page "
        +
        "from the MEXO bot."
    );

}

</script>


</body>
</html>
