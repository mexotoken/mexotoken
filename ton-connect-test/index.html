<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MEXO — TON Wallet</title>

<!-- TON Connect UI -->
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #08090b;
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   MAIN APP
========================= */

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 18px 16px 20px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    position: relative;
}

/* =========================
   LOGO
========================= */

.brand {
    text-align: center;
    margin-bottom: 12px;
}

.logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    display: block;
    margin: 0 auto 5px;
}

.brand-name {
    font-size: 46px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 2px;
    margin: 0;
}

.subtitle {
    margin-top: 9px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #e7c300;
}

/* =========================
   INTRO
========================= */

.intro {
    text-align: center;
    margin: 14px auto 14px;
    max-width: 430px;
}

.intro-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 5px;
}

.intro-text {
    margin: 0;
    color: #a9abb0;
    font-size: 14px;
    line-height: 1.45;
}

/* =========================
   SECURITY BOX
========================= */

.security {
    position: relative;
    border: 1px solid rgba(255, 213, 0, 0.65);
    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 210, 0, 0.07),
            rgba(255, 210, 0, 0.015)
        );

    padding: 10px 14px;
    margin-bottom: 14px;

    text-align: center;

    animation: securityPulse 2.2s ease-in-out infinite;
}

.security-title {
    color: #ffd600;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 2px;
}

.security-text {
    color: #c9c9c9;
    font-size: 12px;
    line-height: 1.35;
    margin: 0;
}

.security-text strong {
    color: #ffffff;
}

/* subtle blinking effect */
@keyframes securityPulse {
    0%,
    100% {
        box-shadow:
            0 0 0 rgba(255, 210, 0, 0),
            inset 0 0 0 rgba(255, 210, 0, 0);
    }

    50% {
        box-shadow:
            0 0 18px rgba(255, 210, 0, 0.22),
            inset 0 0 10px rgba(255, 210, 0, 0.04);
    }
}

/* =========================
   CONNECT BUTTON
========================= */

.connect-button {
    width: 100%;
    height: 58px;

    border: none;
    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ffe600,
            #e8b900
        );

    color: #090909;

    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.2px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(238, 190, 0, 0.18);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.connect-button:active {
    transform: scale(0.98);
    box-shadow:
        0 4px 15px rgba(238, 190, 0, 0.15);
}

.connect-icon {
    font-size: 22px;
    vertical-align: -2px;
    margin-right: 5px;
}

/* =========================
   OR
========================= */

.or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 11px 0;
}

.or-line {
    height: 1px;
    background: #2c2d30;
    flex: 1;
}

.or-text {
    color: #77797d;
    font-size: 11px;
    font-weight: 800;
}

/* =========================
   MANUAL ADDRESS
========================= */

.manual {
    width: 100%;
}

.manual-row {
    display: flex;
    width: 100%;
    gap: 8px;
}

.address-input {
    min-width: 0;
    flex: 1;
    height: 52px;

    border: 1px solid #36383c;
    border-radius: 13px;

    background: #111214;
    color: #ffffff;

    padding: 0 13px;

    font-size: 14px;
    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.address-input::placeholder {
    color: #66686c;
}

.address-input:focus {
    border-color: #e7c300;
    box-shadow: 0 0 0 2px rgba(231, 195, 0, 0.08);
}

.confirm-button {
    width: 105px;
    height: 52px;

    border: none;
    border-radius: 13px;

    background: #e7c300;
    color: #090909;

    font-size: 13px;
    font-weight: 900;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.confirm-button:active {
    transform: scale(0.97);
}

.confirm-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================
   STATUS
========================= */

.status {
    min-height: 18px;
    text-align: center;

    margin-top: 8px;

    font-size: 12px;
    line-height: 1.3;
}

.status.success {
    color: #62e6a4;
}

.status.error {
    color: #ff7373;
}

.status.info {
    color: #b9b9bd;
}

/* =========================
   CONNECTED WALLET
========================= */

.connected {
    display: none;

    margin-top: 9px;

    border: 1px solid rgba(65, 220, 140, 0.45);
    border-radius: 13px;

    background: rgba(20, 80, 52, 0.18);

    padding: 10px;

    text-align: center;
}

.connected-title {
    color: #68e7a7;
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 5px;
}

.connected-address {
    color: #d9d9dc;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.4;

    word-break: break-all;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 11px;

    color: #515358;
    font-size: 10px;
    letter-spacing: 1px;
}

/* =========================
   TON CONNECT HIDDEN ROOT
========================= */

#ton-connect-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}

/* =========================
   MOBILE OPTIMIZATION
========================= */

@media (max-height: 720px) {

    .app {
        padding-top: 10px;
        padding-bottom: 10px;
    }

    .logo {
        width: 52px;
        height: 52px;
    }

    .brand-name {
        font-size: 38px;
    }

    .subtitle {
        font-size: 14px;
        margin-top: 6px;
    }

    .intro {
        margin-top: 9px;
        margin-bottom: 9px;
    }

    .security {
        padding: 8px 12px;
        margin-bottom: 9px;
    }

    .connect-button {
        height: 53px;
    }

    .or-divider {
        margin: 8px 0;
    }

    .address-input,
    .confirm-button {
        height: 48px;
    }

    .footer {
        margin-top: 7px;
    }
}

/* =========================
   VERY SMALL SCREENS
========================= */

@media (max-height: 620px) {

    .app {
        justify-content: flex-start;
        padding-top: 8px;
    }

    .logo {
        width: 42px;
        height: 42px;
    }

    .brand-name {
        font-size: 32px;
    }

    .subtitle {
        font-size: 12px;
    }

    .intro-text {
        font-size: 12px;
    }

    .security-text {
        font-size: 11px;
    }

    .security-title {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         BRAND
    ========================== -->

    <div class="brand">

        <!--
        IMPORTANT:
        If your logo is stored elsewhere, change this path.
        Example:
        assets/logo.png
        -->

        <img
            src="assets/logo.png"
            alt="MEXO"
            class="logo"
            onerror="this.style.display='none';"
        >

        <h1 class="brand-name">MEXO</h1>

        <div class="subtitle">
            ADD YOUR TON WALLET
        </div>

    </div>


    <!-- =========================
         INTRO
    ========================== -->

    <div class="intro">

        <div class="intro-title">
            Choose one of the two methods below
        </div>

        <p class="intro-text">
            to register your TON wallet address.
        </p>

    </div>


    <!-- =========================
         SECURITY
    ========================== -->

    <div class="security">

        <div class="security-title">
            🔒 100% SECURE
        </div>

        <p class="security-text">
            Your <strong>seed phrase</strong> and
            <strong>private key</strong> are never requested.
        </p>

    </div>


    <!-- =========================
         DIRECT CONNECT
    ========================== -->

    <button
        type="button"
        class="connect-button"
        id="connectWalletBtn"
    >
        <span class="connect-icon">🔗</span>
        CONNECT TON WALLET
    </button>


    <!-- Hidden TON Connect UI container -->
    <div id="ton-connect-hidden"></div>


    <!-- =========================
         OR
    ========================== -->

    <div class="or-divider">

        <div class="or-line"></div>

        <div class="or-text">
            OR
        </div>

        <div class="or-line"></div>

    </div>


    <!-- =========================
         MANUAL ADDRESS
    ========================== -->

    <div class="manual">

        <div class="manual-row">

            <input
                type="text"
                id="addressInput"
                class="address-input"
                inputmode="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="EQ... or UQ..."
                maxlength="100"
            >

            <button
                type="button"
                class="confirm-button"
                id="confirmAddressBtn"
                disabled
            >
                ✓ CONFIRM
            </button>

        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- =========================
         CONNECTED INFO
    ========================== -->

    <div
        id="connectedBox"
        class="connected"
    >

        <div class="connected-title">
            ✓ TON WALLET CONNECTED
        </div>

        <div
            id="connectedAddress"
            class="connected-address"
        ></div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">
        MEXO • SECURE AIRDROP
    </div>

</div>


<script>

/* =========================================================
   MEXO TON WALLET CONNECTION
========================================================= */

/*
IMPORTANT:
Your public website must contain:

https://YOUR-DOMAIN/tonconnect-manifest.json

For your GitHub Pages site, the manifest URL below should
match the actual public URL of the manifest.

If your current website URL is:

https://mexotoken.github.io/mexotoken/

then use:

https://mexotoken.github.io/mexotoken/tonconnect-manifest.json
*/

const MANIFEST_URL =
    "https://mexotoken.github.io/mexotoken/tonconnect-manifest.json";


/* =========================================================
   ELEMENTS
========================================================= */

const connectButton =
    document.getElementById("connectWalletBtn");

const addressInput =
    document.getElementById("addressInput");

const confirmButton =
    document.getElementById("confirmAddressBtn");

const statusBox =
    document.getElementById("status");

const connectedBox =
    document.getElementById("connectedBox");

const connectedAddress =
    document.getElementById("connectedAddress");


/* =========================================================
   STATUS HELPER
========================================================= */

function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
        "status " + (type || "info");

}


/* =========================================================
   BASIC TON ADDRESS CHECK
========================================================= */

function isValidTonAddress(address) {

    address = address.trim();

    /*
    TON user-friendly addresses normally start with
    EQ... or UQ...

    We intentionally accept both formats.

    Raw addresses beginning with 0: are also accepted
    because TON addresses can be represented in raw form.
    */

    if (/^(EQ|UQ)[A-Za-z0-9_-]{46,70}$/.test(address)) {
        return true;
    }

    if (/^0:[a-fA-F0-9]{64}$/.test(address)) {
        return true;
    }

    return false;
}


/* =========================================================
   ENABLE / DISABLE CONFIRM
========================================================= */

addressInput.addEventListener("input", function () {

    const value =
        addressInput.value.trim();

    confirmButton.disabled =
        value.length === 0;

    if (value.length === 0) {
        showStatus("", "");
    }

});


/* =========================================================
   MANUAL ADDRESS
========================================================= */

confirmButton.addEventListener("click", function () {

    const address =
        addressInput.value.trim();

    if (!address) {

        showStatus(
            "Please enter your TON wallet address.",
            "error"
        );

        return;
    }


    if (!isValidTonAddress(address)) {

        showStatus(
            "Invalid TON wallet address. Please check it.",
            "error"
        );

        return;
    }


    /*
    At this point the address has passed the local format
    validation.

    Later we can connect this action to the Telegram bot
    backend and save the address to the user's account.
    */

    showStatus(
        "✓ TON wallet address confirmed.",
        "success"
    );


    connectedBox.style.display =
        "block";

    connectedAddress.textContent =
        address;


    /*
    Save locally as a temporary browser value.
    This is NOT the final backend storage.
    */

    try {

        localStorage.setItem(
            "mexo_ton_address",
            address
        );

    } catch (e) {

        console.log(
            "Local storage unavailable:",
            e
        );

    }

});


/* =========================================================
   TON CONNECT INITIALIZATION
========================================================= */

let tonConnectUI = null;


function initializeTonConnect() {

    try {

        if (
            !window.TON_CONNECT_UI ||
            !window.TON_CONNECT_UI.TonConnectUI
        ) {

            showStatus(
                "TON Connect could not be loaded. Please try again.",
                "error"
            );

            return;

        }


        tonConnectUI =
            new window.TON_CONNECT_UI.TonConnectUI({

                manifestUrl:
                    MANIFEST_URL,

                buttonRootId:
                    null,

                restoreConnection:
                    true,

                language:
                    "en"

            });


        /*
        Listen for wallet connection changes.
        */

        tonConnectUI.onStatusChange(
            function(wallet) {

                if (!wallet) {

                    return;
                }


                const address =
                    wallet.account.address;


                /*
                The SDK returns the connected TON account.
                We only use the wallet address.
                */

                showConnectedWallet(address);

            }
        );


        /*
        If a previous session is already restored,
        show it immediately.
        */

        if (tonConnectUI.wallet) {

            showConnectedWallet(
                tonConnectUI.wallet.account.address
            );

        }

    } catch (error) {

        console.error(
            "TON Connect initialization error:",
            error
        );

        showStatus(
            "TON Connect initialization failed.",
            "error"
        );

    }

}


/* =========================================================
   SHOW CONNECTED WALLET
========================================================= */

function showConnectedWallet(address) {

    if (!address) {
        return;
    }


    connectedBox.style.display =
        "block";


    connectedAddress.textContent =
        address;


    showStatus(
        "✓ TON wallet connected successfully.",
        "success"
    );


    /*
    Put the connected address into the manual field too,
    so the user can see exactly which address was detected.
    */

    addressInput.value =
        address;


    confirmButton.disabled =
        false;


    /*
    Temporary local storage.
    */

    try {

        localStorage.setItem(
            "mexo_ton_address",
            address
        );

    } catch (e) {

        console.log(
            "Local storage unavailable:",
            e
        );

    }

}


/* =========================================================
   DIRECT CONNECT BUTTON
========================================================= */

connectButton.addEventListener(
    "click",
    async function() {

        if (!tonConnectUI) {

            showStatus(
                "TON Connect is still loading. Please try again.",
                "error"
            );

            initializeTonConnect();

            return;
        }


        try {

            showStatus(
                "Opening TON wallet selection...",
                "info"
            );


            /*
            Official TON Connect UI method.

            No transaction is created.
            No funds are requested.
            This only starts the wallet connection flow.
            */

            await tonConnectUI.openModal();

        } catch (error) {

            console.error(
                "TON Connect error:",
                error
            );


            showStatus(
                "Wallet connection was cancelled or failed.",
                "error"
            );

        }

    }
);


/* =========================================================
   RESTORE SAVED ADDRESS
========================================================= */

try {

    const savedAddress =
        localStorage.getItem(
            "mexo_ton_address"
        );


    if (savedAddress) {

        addressInput.value =
            savedAddress;

        confirmButton.disabled =
            false;

    }

} catch (e) {

    console.log(
        "Could not read local storage:",
        e
    );

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function() {

        initializeTonConnect();

    }
);

</script>

</body>
</html>
