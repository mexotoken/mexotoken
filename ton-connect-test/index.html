<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MEXO Wallet</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {

    background:
        radial-gradient(
            circle at top,
            #2b2112 0%,
            #17130d 45%,
            #0b0a08 100%
        );

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* ==========================================
   MAIN CONTAINER
   ========================================== */

.wallet-card {

    width: min(92vw, 430px);

    min-height: 560px;

    max-height: 94vh;

    padding: 24px 22px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(35, 29, 19, 0.98),
            rgba(15, 13, 10, 0.98)
        );

    border: 1px solid rgba(232, 179, 69, 0.28);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.04);

    display: flex;
    flex-direction: column;

    align-items: center;

    justify-content: center;

    position: relative;
}


/* ==========================================
   LOGO
   ========================================== */

.logo {

    width: 82px;
    height: 82px;

    object-fit: contain;

    margin-bottom: 7px;

    filter:
        drop-shadow(
            0 5px 18px rgba(228, 174, 60, 0.25)
        );
}


/* ==========================================
   TITLE
   ========================================== */

.title {

    margin: 0;

    font-size: 27px;

    font-weight: 800;

    letter-spacing: 4px;

    color: #f0c45d;

    text-align: center;
}


.subtitle {

    margin-top: 5px;

    margin-bottom: 17px;

    font-size: 12px;

    color: rgba(255,255,255,0.58);

    letter-spacing: 1.1px;

    text-align: center;
}


/* ==========================================
   DESCRIPTION
   ========================================== */

.description {

    width: 100%;

    text-align: center;

    font-size: 14px;

    line-height: 1.55;

    color: rgba(255,255,255,0.82);

    margin-bottom: 12px;
}


/* ==========================================
   SECURITY WARNING
   ========================================== */

.security {

    width: 100%;

    padding: 10px 12px;

    border-radius: 12px;

    border: 1px solid rgba(255, 105, 105, 0.45);

    background:
        rgba(39, 31, 21, 0.95);

    color: #f5e7c9;

    text-align: center;

    font-size: 11.5px;

    line-height: 1.45;

    margin-bottom: 13px;

    animation: securityBlink 1s infinite;

    transition:
        background-color 0.5s ease,
        border-color 0.5s ease;
}


@keyframes securityBlink {

    0%,
    45% {

        background-color:
            rgba(39, 31, 21, 0.95);

        border-color:
            rgba(232, 179, 69, 0.45);
    }

    50%,
    100% {

        background-color:
            rgba(105, 35, 35, 0.72);

        border-color:
            rgba(255, 100, 100, 0.72);
    }
}


/* ==========================================
   CONNECT BUTTON
   ========================================== */

.connect-button {

    width: 100%;

    height: 48px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #f0c45d,
            #c88e24
        );

    color: #171109;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: 0.4px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(212, 157, 42, 0.22);

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}


.connect-button:active {

    transform: scale(0.98);

}


.connect-button:disabled {

    opacity: 0.55;

    cursor: default;
}


/* ==========================================
   MANUAL SECTION
   ========================================== */

.manual-title {

    width: 100%;

    margin-top: 15px;

    margin-bottom: 7px;

    font-size: 12px;

    color: rgba(255,255,255,0.58);

    text-align: left;
}


.manual-row {

    width: 100%;

    display: flex;

    gap: 7px;

    align-items: center;
}


.wallet-input {

    flex: 1;

    min-width: 0;

    height: 43px;

    padding: 0 11px;

    border-radius: 11px;

    border: 1px solid rgba(255,255,255,0.13);

    outline: none;

    background:
        rgba(255,255,255,0.055);

    color: #ffffff;

    font-size: 11px;

    letter-spacing: 0.15px;
}


.wallet-input::placeholder {

    color:
        rgba(255,255,255,0.35);
}


.wallet-input:focus {

    border-color:
        rgba(240,196,93,0.65);
}


.confirm-button {

    width: 88px;

    height: 43px;

    border: none;

    border-radius: 11px;

    background:
        rgba(240,196,93,0.15);

    border: 1px solid
        rgba(240,196,93,0.42);

    color: #f0c45d;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;
}


.confirm-button:active {

    transform: scale(0.98);
}


/* ==========================================
   STATUS
   ========================================== */

.status {

    width: 100%;

    min-height: 18px;

    margin-top: 10px;

    text-align: center;

    font-size: 11px;

    color: rgba(255,255,255,0.62);
}


/* ==========================================
   FOOTER
   ========================================== */

.footer {

    margin-top: 13px;

    font-size: 9px;

    color: rgba(255,255,255,0.28);

    text-align: center;
}


/* ==========================================
   RESPONSIVE
   ========================================== */

@media (max-height: 650px) {

    .wallet-card {

        min-height: 0;

        padding-top: 17px;

        padding-bottom: 17px;
    }

    .logo {

        width: 66px;

        height: 66px;
    }

    .title {

        font-size: 24px;
    }

    .subtitle {

        margin-bottom: 11px;
    }

    .description {

        margin-bottom: 8px;
    }

    .security {

        margin-bottom: 9px;

        padding: 8px 10px;
    }

    .manual-title {

        margin-top: 10px;
    }

    .footer {

        margin-top: 8px;
    }
}

</style>

</head>


<body>


<div class="wallet-card">


    <!-- ======================================
         LOGO
         ====================================== -->

    <img
        class="logo"
        src="https://raw.githubusercontent.com/mexotoken/mexotoken/main/logo.png"
        alt="MEXO"
    >


    <!-- ======================================
         TITLE
         ====================================== -->

    <h1 class="title">
        MEXO
    </h1>

    <div class="subtitle">
        TON WALLET
    </div>


    <!-- ======================================
         DESCRIPTION
         ====================================== -->

    <div class="description">

        Add your TON wallet address.

        <br>

        Choose how you want to provide it.

    </div>


    <!-- ======================================
         SECURITY MESSAGE
         ====================================== -->

    <div class="security">

        🔐 <strong>Security notice:</strong>
        MEXO only needs your public TON wallet address.
        Never enter your seed phrase or private key.

    </div>


    <!-- ======================================
         DIRECT CONNECT
         ====================================== -->

    <button
        id="connectButton"
        class="connect-button"
        onclick="connectWallet()"
    >
        💎 CONNECT TON WALLET
    </button>


    <!-- ======================================
         MANUAL ADDRESS
         ====================================== -->

    <div class="manual-title">

        Or enter your TON wallet address manually

    </div>


    <div class="manual-row">

        <input
            id="walletInput"
            class="wallet-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="EQ... / UQ..."
        >

        <button
            id="confirmButton"
            class="confirm-button"
            onclick="confirmManualWallet()"
        >
            CONFIRM
        </button>

    </div>


    <!-- ======================================
         STATUS
         ====================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <div class="footer">

        MEXO • TON Network

    </div>


</div>


<script>

/* ==========================================
   MEXO WALLET PAGE
   ========================================== */


/*
    IMPORTANT:

    The Withdraw command opens this page with:

    ?sid=12345678

    We keep that session ID and send it back
    to the Telegram bot together with the
    wallet address.
*/


const BOT_USERNAME = "mexoairdrop_bot";


const params = new URLSearchParams(
    window.location.search
);


const sessionId = params.get("sid") || "";


/* ==========================================
   ELEMENTS
   ========================================== */

const walletInput =
    document.getElementById("walletInput");

const statusBox =
    document.getElementById("status");

const connectButton =
    document.getElementById("connectButton");

const confirmButton =
    document.getElementById("confirmButton");


/* ==========================================
   STATUS FUNCTION
   ========================================== */

function setStatus(text) {

    statusBox.textContent = text;

}


/* ==========================================
   TON ADDRESS VALIDATION
   ========================================== */

function isValidTonAddress(address) {

    address = address.trim();

    if (!address) {
        return false;
    }

    if (
        !address.startsWith("EQ") &&
        !address.startsWith("UQ")
    ) {

        return false;

    }

    if (address.length !== 48) {

        return false;

    }

    return true;

}


/* ==========================================
   RETURN TO TELEGRAM BOT
   ========================================== */

function returnToBot(walletAddress) {

    walletAddress =
        walletAddress.trim();


    /* --------------------------------------
       Check session
       -------------------------------------- */

    if (!sessionId) {

        setStatus(
            "❌ Invalid withdrawal session."
        );

        return;

    }


    /* --------------------------------------
       Check wallet
       -------------------------------------- */

    if (
        !isValidTonAddress(
            walletAddress
        )
    ) {

        setStatus(
            "❌ Please enter a valid TON wallet address."
        );

        return;

    }


    /* --------------------------------------
       Build Telegram parameter
       -------------------------------------- */

    const startParameter =
        "w_"
        + sessionId
        + "_"
        + walletAddress;


    /*
       Telegram start parameter has a practical
       length limitation.

       The session + 48 character TON address
       stays within the normal range.
    */


    const telegramUrl =
        "https://t.me/"
        + BOT_USERNAME
        + "?start="
        + encodeURIComponent(
            startParameter
        );


    /* --------------------------------------
       Disable controls
       -------------------------------------- */

    connectButton.disabled = true;

    confirmButton.disabled = true;

    walletInput.disabled = true;


    setStatus(
        "✅ Wallet confirmed. Returning to MEXO..."
    );


    /* --------------------------------------
       Open Telegram bot
       -------------------------------------- */

    window.location.href =
        telegramUrl;

}


/* ==========================================
   MANUAL CONFIRM
   ========================================== */

function confirmManualWallet() {

    const address =
        walletInput.value.trim();


    if (
        !isValidTonAddress(
            address
        )
    ) {

        setStatus(
            "❌ Invalid TON wallet address."
        );

        walletInput.focus();

        return;

    }


    returnToBot(
        address
    );

}


/* ==========================================
   CONNECT TON WALLET
   ========================================== */

async function connectWallet() {

    /*
       The actual TON Connect integration depends
       on the TON Connect manifest and wallet
       connection environment.

       For now, if TON Connect is available in the
       page, we use it.

       Otherwise the user can always use the
       manual TON address field.
    */


    setStatus(
        "Opening TON wallet..."
    );


    try {

        /*
           TON Connect bridge/provider detection.

           This does not request any transaction
           or transfer of funds.
        */

        if (
            window.tonConnectUI
            &&
            typeof window.tonConnectUI.openModal
            === "function"
        ) {

            await window.tonConnectUI.openModal();

            return;

        }


        /*
           Try Telegram Mini App TON integration
           if available.
        */

        if (
            window.Telegram
            &&
            window.Telegram.WebApp
        ) {

            /*
               No automatic transaction is requested.

               If a connected wallet address is already
               exposed by the integration, use it.
            */

            const tonWallet =
                window.Telegram.WebApp
                    .initDataUnsafe
                    ?.user
                    ?.wallet;


            if (tonWallet) {

                returnToBot(
                    tonWallet
                );

                return;

            }

        }


        /*
           No direct wallet provider detected.
        */

        setStatus(
            "Wallet connection is unavailable here. "
            + "You can enter your TON address manually."
        );


    } catch (error) {

        console.error(
            error
        );

        setStatus(
            "Wallet connection was cancelled. "
            + "You can enter your address manually."
        );

    }

}


/* ==========================================
   ENTER KEY
   ========================================== */

walletInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            confirmManualWallet();

        }

    }
);


/* ==========================================
   INITIAL SESSION CHECK
   ========================================== */

if (!sessionId) {

    setStatus(
        "⚠️ Please open this page from the MEXO bot."
    );

}

</script>


</body>
</html>
